<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORQUERA PARKOUR KINECT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
:root{--bg:#071226;--card:#0d1b33;--tx:#f1f6ff;--mu:#a1b0c7;--ac:#2388ff;--ac2:#20c7e8;--bd:#20385a;--ok:#43d995;--bad:#ff716e;--fh:Oswald,Impact,'Arial Narrow',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;color:var(--tx);font:15px system-ui,sans-serif;background:var(--bg) radial-gradient(circle at 0% 0%,rgba(35,136,255,.20),transparent 38%),radial-gradient(circle at 100% 100%,rgba(32,199,232,.13),transparent 36%) fixed}
main{max-width:980px;margin:0 auto;padding:12px}
.brand{display:flex;align-items:center;gap:14px;padding:6px 2px 12px;border-bottom:4px solid transparent;border-image:repeating-linear-gradient(135deg,var(--ac) 0 10px,transparent 10px 20px) 1;margin-bottom:12px}
.brand img{width:76px;height:76px;border-radius:12px;border:2px solid var(--ac);background:#fff;flex:none;object-fit:contain}
.brand h1{font:700 clamp(20px,5.5vw,32px)/1 var(--fh);letter-spacing:.07em;text-transform:uppercase;margin:0;text-shadow:2px 2px 0 var(--ac)}
.brand span{font:500 12px var(--fh);letter-spacing:.35em;text-transform:uppercase;color:var(--ac2)}
h1{font:700 20px var(--fh);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 10px}
nav{position:sticky;top:0;z-index:50;display:flex;gap:7px;overflow-x:auto;margin:0 -2px 12px;padding:8px 4px;background:rgba(7,18,38,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(75,139,210,.18);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.18);scrollbar-width:thin}nav button{white-space:nowrap;border-radius:999px;flex:0 0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button,input,select,textarea{font:inherit;color:inherit;background:#0a172c;border:1px solid #28466d;border-radius:12px;padding:9px 12px;transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .12s ease}
button{cursor:pointer;font-family:var(--fh);letter-spacing:.05em;text-transform:uppercase;font-weight:500;background:linear-gradient(135deg,rgba(35,136,255,.17),rgba(32,199,232,.09));border-color:#28558a;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.12)}button:hover{border-color:#3da9ff;background:linear-gradient(135deg,rgba(35,136,255,.30),rgba(32,199,232,.18));box-shadow:0 5px 16px rgba(22,125,255,.16)}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid #20c7e8;outline-offset:2px}
button.on,button.p{background:linear-gradient(135deg,#1976f3,#20c7e8);color:#fff;border-color:transparent;transform:none;box-shadow:0 5px 16px rgba(35,136,255,.24)}
.card{background:linear-gradient(145deg,rgba(16,36,66,.98),rgba(10,25,47,.98));border:1px solid rgba(65,113,171,.35);border-left:4px solid var(--ac);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 10px 26px rgba(0,0,0,.17)}
.card b{font-family:var(--fh);letter-spacing:.05em;text-transform:uppercase}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}input:focus,select:focus,textarea:focus{outline:none;border-color:#2f9bff;box-shadow:0 0 0 3px rgba(35,136,255,.18),0 0 18px rgba(35,136,255,.10)}
.w{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}tbody tr{transition:background .15s ease}tbody tr:hover{background:rgba(35,136,255,.10)}th{color:var(--ac2);font-family:var(--fh);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.mu{color:var(--mu)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k div{background:linear-gradient(145deg,#0a1930,#102544);border:1px solid rgba(65,113,171,.22);border-radius:13px;padding:10px;border-bottom:3px solid var(--ac)}.k b{display:block;font:700 22px var(--fh)}
textarea{width:100%;min-height:80px}.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* PLANTILLA VISUAL DE GRUPOS */
.pgdd{position:fixed;z-index:60;display:none;overflow-y:auto;background:var(--card);color:var(--tx);border:1px solid var(--ac);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.45);font:13px system-ui,sans-serif;-webkit-overflow-scrolling:touch}
.pgdd .pgi{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bd);text-align:left}
.pgdd .pgi b{font-weight:600;white-space:normal}.pgdd .pgi span{font-size:11px;color:var(--mu);white-space:nowrap}
.pgdd .pgi:hover,.pgdd .pgi.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}.pgdd .pgi:hover span,.pgdd .pgi.on span{color:#e8f9fd}
.pgdd .pgi.clr{color:var(--bad);font-weight:600}
.pgdd .pgh{position:sticky;top:0;padding:5px 10px;font:500 11px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--ac2);background:var(--bg)}
.pg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #111;border-radius:4px;background:#fff;color:#111}
.pg{border-collapse:collapse;width:max-content;min-width:760px;font-size:11px;font-family:Arial,sans-serif}
.pg th,.pg td{border:1px solid #111;padding:0;white-space:nowrap;text-align:center;height:25px}
.pg .pg-day{font-weight:700;writing-mode:horizontal-tb;background:#eee;width:118px;min-width:118px;white-space:normal;line-height:1.1}
.pg .pg-level{font-weight:700;min-width:145px;height:34px;white-space:normal;line-height:1.05;color:#17243a}
.pg .pg-cant{width:72px;min-width:72px;background:#fff;font-weight:700}
.pg .pg-total{width:72px;min-width:72px;background:#fff;font-weight:700}
.pg .pg-red{background:#f2a09d}.pg .pg-yellow{background:#fff0a8}.pg .pg-green{background:#b9e8bd}.pg .pg-cyan{background:#a9e8ee}
.pg input.pg-in{border:0;border-radius:0;background:transparent;color:#111;width:100%;height:24px;padding:2px 4px;text-align:center;font:700 11px Arial,sans-serif;outline:none}
.pg input.pg-in:focus{background:#fff3a6;box-shadow:inset 0 0 0 2px #1688d4}
.pg input.pg-num{width:55px;text-align:center;font-weight:700}
.pg .pg-totaln{font-size:14px;font-weight:800;background:#fff}
.pg .pg-foot{font-weight:700;height:28px;background:#fff}
.pg .pg-foot input{font-weight:700}
.pg-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pg-config{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px;margin-bottom:8px}
.pg-config input{width:100%}
.pg-note{font-size:12px;color:var(--mu);margin-bottom:8px}
.pg-block{border-left:4px solid var(--ac);margin-bottom:12px;padding:10px;background:var(--card);border:1px solid var(--bd);border-left-width:4px;border-radius:6px}
.pg-block-title{font:700 16px var(--fh);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.pg-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pg-mini{padding:5px 8px;font-size:11px}
@media(max-width:700px){.pg{font-size:10px}.pg .pg-level{min-width:125px}.pg .pg-day{min-width:100px;width:100px}.pg input.pg-in{font-size:10px}.pg-block{padding:8px}}


/* AJUSTES VISUALES OPK: tema azul marino consistente en móvil y escritorio */
:root{color-scheme:dark}
button.on,button.p,nav button{transform:none}
.pg-wrap{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pg .pg-day,.pg .pg-cant,.pg .pg-total,.pg .pg-totaln,.pg .pg-foot{color:#17243a}
.pg .pg-red,.pg .pg-yellow,.pg .pg-green,.pg .pg-cyan{color:#17243a}
.pg-block{background:linear-gradient(145deg,rgba(16,36,66,.98),rgba(10,25,47,.98));border-radius:14px}
.pg-block-title{color:#eaf3ff}
@media(max-width:700px){
  main{padding:10px}
  nav{top:env(safe-area-inset-top,0px);gap:5px;padding:7px}
  nav button{padding:8px 11px;font-size:12px}
  .card{border-radius:14px;padding:11px}
  button,input,select,textarea{max-width:100%}
}

<script type="module">
(async function(){
  const mostrarError = (msg) => {
    console.error("OPK Firebase:", msg);
    const app = document.getElementById("app");
    if (app) {
      app.innerHTML = `
        <div class="card" style="max-width:760px;margin:40px auto">
          <h1>Error de conexión</h1>
          <div class="mu" style="white-space:pre-wrap;word-break:break-word">${String(msg).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</div>
          <div class="r">
            <button class="p" onclick="location.reload()">Reintentar</button>
          </div>
        </div>`;
    }
  };

  try {
    const [appMod, fsMod, authMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js")
    ]);

    const { initializeApp, deleteApp } = appMod;
    const { getFirestore, collection, doc, setDoc, deleteDoc, getDocs } = fsMod;
    const { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } = authMod;

    const firebaseConfig = {
      apiKey: "AIzaSyAvL4C3aSXdWGXgOKNzuc1AsayAJNlVcDg",
      authDomain: "opk-parkour.firebaseapp.com",
      projectId: "opk-parkour",
      storageBucket: "opk-parkour.firebasestorage.app",
      messagingSenderId: "350579392653",
      appId: "1:350579392653:web:abfe60db9d4f0743fe62c4",
      measurementId: "G-L4JZ31049P"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.FB = {
      app, db, auth, collection, doc, setDoc, deleteDoc, getDocs,
      signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword,
      initializeApp, deleteApp, getAuth, config: firebaseConfig
    };

    window.dispatchEvent(new Event("firebaseReady"));
  } catch (e) {
    mostrarError("No se pudo iniciar Firebase.\n\n" + (e?.message || String(e)));
    window.dispatchEvent(new CustomEvent("firebaseError", { detail: e?.message || String(e) }));
  }
})();

<!-- SCRIPT 2: SISTEMA PRINCIPAL -->
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$=n=>'$'+Number(n||0).toLocaleString('es-AR'),fd=s=>s?s.split('-').reverse().join('/'):'';
const hoy=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const CATS=['KIDS 1','KIDS 2','JOVEN Y ADULTO'],DIAS={'L M V':[1,3,5],'M J':[2,4],'SABADOS':[6]};
const A='adm/root/',P={alumnos:'alumnos',pend:'pend',asistA:'asistA',usr:'usr',pagos:A+'pagos',egresos:A+'egresos',profes:A+'profes',horas:'horasP',prof:'prof',extras:A+'extras',cupos:'cupos',plantillas:'plantillas'};
const C={};Object.keys(P).forEach(k=>C[k]={});
const got={};let rol=null,db=true,U={canEdit:()=>false},ED=false,me=null,loaded=false,dirty=false,tab='',mes=hoy.slice(0,7),fecha=hoy,q='',edit=null,authUser=null;

const L=k=>Object.values(C[k]),err=e=>alert('No se pudo guardar: '+((e&&e.message)||e));

const put=async(k,id,d)=>{
  C[k][String(id)]={...d};
  got[k]=1; sync(); rr();
  if (window.FB) {
    try {
      await window.FB.setDoc(window.FB.doc(window.FB.db, P[k], String(id)), d);
    } catch(e) { console.error("Error al guardar en Firebase:", e); }
  }
  return d;
};

const rm=async(k,id)=>{
  delete C[k][String(id)];
  rr();
  if (window.FB) {
    try {
      await window.FB.deleteDoc(window.FB.doc(window.FB.db, P[k], String(id)));
    } catch(e) { console.error("Error al borrar en Firebase:", e); }
  }
};

const uid=()=>String(Date.now())+Math.floor(Math.random()*99);
const card=h=>`<div class="card">${h}</div>`,opts=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${esc(x)}</option>`).join('');
const al=c=>C.alumnos[c],nom=c=>al(c)?al(c).nombre:'(eliminado)',pn=id=>(C.profes[id]||{nombre:'(eliminado)'}).nombre;
const apell=c=>{const w=String(nom(c)||'').trim().split(/\s+/);return (w.length>1?w[w.length-1]+' '+w.slice(0,-1).join(' '):w[0]||'')};
const ordPagos=(a,b)=>b.fecha.localeCompare(a.fecha)||apell(a.cod).localeCompare(apell(b.cod),'es',{sensitivity:'base'});
const sorted=()=>L('alumnos').sort((a,b)=>a.nombre.localeCompare(b.nombre));
const nextCod=()=>Math.max(0,...L('alumnos').map(a=>a.cod))+1;
const edad=n=>{if(!n)return'';const d=new Date(n),t=new Date();let e=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))e--;return e};
const dueno=()=>me&&String(me.rol||'').trim().toLowerCase()=='dueño',isIn=()=>/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
const puede=()=>dueno()||(me&&String(me.rol||'').trim().toLowerCase()=='coordinador'),activo=a=>a.activo!==false,actAl=()=>sorted().filter(activo);
const mesI=()=>card(`<label>Mes</label><input type="month" value="${mes}" onchange="mes=this.value;render()">`);

window.addEventListener('firebaseError', (ev) => {
  loaded = false;
  const msg = ev?.detail || 'No se pudo iniciar Firebase.';
  const app = $('#app');
  if (app) {
    app.innerHTML = card(`
      <h1>No se pudo conectar</h1>
      <div class="mu" style="white-space:pre-wrap;word-break:break-word">${esc(msg)}</div>
      <div class="r"><button class="p" onclick="location.reload()">Reintentar</button></div>
    `);
  }
});

window.addEventListener('firebaseReady', async () => {
  try {
    const keys = Object.keys(P);

    await Promise.all(keys.map(async (k) => {
      let snap;try{snap = await window.FB.getDocs(window.FB.collection(window.FB.db, P[k]));}catch(e){if(k==='cupos'){got[k]=1;return;}throw e;}
      snap.forEach((d) => {
        const raw = d.data() || {};
        if (k === 'usr') {
          const rawRol = raw.rol ?? raw.ROL ?? '';
          const rawEmail = raw.email ?? raw.EMAIL ?? '';
          const rawUid = raw.uid ?? raw.UID ?? '';
          const rawNombre = raw.nombre ?? raw.NOMBRE ?? d.id;
          C[k][d.id] = {
            ...raw,
            nombre: rawNombre,
            email: rawEmail,
            uid: rawUid,
            rol: String(rawRol).trim().toLowerCase()
          };
        } else {
          C[k][d.id] = raw;
        }
      });
      got[k] = 1;
    }));

    keys.forEach(k => got[k] = 1);
    loaded = true;

    if (window.FB?.onAuthStateChanged) {
      window.FB.onAuthStateChanged(window.FB.auth, async (user) => {
        authUser = user || null;

        if (!user) {
          me = null;
          rol = null;
          try { sessionStorage.removeItem('u'); } catch(e) {}
          rr();
          return;
        }

        // CAMBIO 1: restaurar la sesión con el usuario guardado, no el primero con ese UID
        const guardado = (()=>{try{return sessionStorage.getItem('u')}catch(e){return null}})();
        const match = (guardado && C.usr[guardado] && C.usr[guardado].uid === user.uid)
          ? [guardado, C.usr[guardado]]
          : Object.entries(C.usr).find(([u,r]) => r.uid === user.uid);

        if (match) {
          const [u,r] = match;
          me = {u,...r,nombre:r.nombre||u,rol:String(r.rol||'').trim().toLowerCase()};
          rol = me.rol;
          try { sessionStorage.setItem('u',u); } catch(e) {}
        } else {
          me = null;
          rol = null;
        }

        rr();
      });
    } else {
      rr();
    }
  } catch(e) {
    console.error("Error descargando datos desde Firebase:", e);
    loaded = false;
    const app = $('#app');
    if (app) {
      app.innerHTML = card(`
        <h1>Error al cargar la base de datos</h1>
        <div class="mu" style="white-space:pre-wrap;word-break:break-word">${esc(e?.message || String(e))}</div>
        <div class="r"><button class="p" onclick="location.reload()">Reintentar</button></div>
      `);
    }
  }
});

const roster=()=>(dueno()?L('profes'):L('prof')).sort((a,b)=>a.nombre.localeCompare(b.nombre));
function sync(){if(!ED||!got.profes||!got.prof)return;
 L('profes').forEach(p=>{if(!C.prof[p.id]||C.prof[p.id].nombre!==p.nombre)put('prof',p.id,{id:p.id,nombre:p.nombre})});
 Object.keys(C.prof).forEach(id=>{if(!C.profes[id])rm('prof',id)})}

function loginV(){
 const n=!L('usr').length;
 const vol='<button onclick="rol=null;render()">← Volver</button>';
 const box=h=>`<div class="card" style="max-width:420px;margin:40px auto">${h}</div>`;

 if(!rol)return box(`<div class="mu" style="text-align:center;margin-bottom:6px">¿Cómo querés ingresar?</div>
 <div class="r" style="justify-content:center">
 <button class="p" onclick="rol='dueño';render()">👑 Soy Dueño</button>
 <button class="p" onclick="rol='coordinador';render()">📋 Soy Coordinador</button>
 </div>`);

 if(!authUser && n && rol!='dueño')return box(`<div class="mu">Primero debe configurarse la cuenta del dueño en Firebase Authentication.</div><div class="r">${vol}</div>`);

 return box(`<h1>Ingreso de ${rol}</h1>
 <div class="mu" style="margin-bottom:8px">Ingresá con el correo y contraseña de Firebase Authentication. El campo usuario debe coincidir con tu usuario existente en la colección <b>usr</b>.</div>

 <label>Usuario del sistema</label><input id="lu" autocapitalize="none" autocomplete="off" style="width:100%">
 <label>Contraseña de Firebase</label><input id="lp" type="password" autocomplete="current-password" style="width:100%">
 <div class="r"><button class="p" onclick="login()">Entrar</button>${vol}</div>`);
}

const ent=(u,r)=>{
 me={u,...r,nombre:r.nombre||u,rol:String(r.rol||'').trim().toLowerCase()};
 rol=me.rol;
 try{sessionStorage.setItem('u',u)}catch(e){}
 tab='';
 render();
};

async function login(){
 const email=$('#le').value.trim();
 const u=$('#lu').value.trim();
 const p=$('#lp').value;
 if(!email||!u||!p)return alert('Completá correo, usuario y contraseña.');

 try{
   const cred=await window.FB.signInWithEmailAndPassword(window.FB.auth,email,p);
   authUser=cred.user;

   const claveUsr = Object.keys(C.usr).find(k => k.toLowerCase() === u.toLowerCase());
   const usuarioEncontrado = claveUsr || u;
   let r=C.usr[usuarioEncontrado];
   if(!r){
     await window.FB.signOut(window.FB.auth);
     authUser=null;
     return alert('Ese usuario no existe en la colección usr.');
   }

   if(!r.uid){
     const actualizado={...r,uid:authUser.uid,email:authUser.email||email};
     await put('usr',usuarioEncontrado,actualizado);
     r=actualizado;
   }

   if(r.uid!==authUser.uid){
     await window.FB.signOut(window.FB.auth);
     authUser=null;
     return alert('Este usuario del sistema ya está vinculado a otra cuenta de Firebase.');
   }

   if(String(r.rol||'').trim().toLowerCase()!=String(rol||'').trim().toLowerCase()){
     await window.FB.signOut(window.FB.auth);
     authUser=null;
     return alert('Esa cuenta no es de '+rol+'. Volvé y elegí la opción correcta.');
   }

   ent(usuarioEncontrado,r);
 }catch(e){
   console.error(e);
   alert('No se pudo iniciar sesión con Firebase: '+((e&&e.message)||e));
 }
}

async function setup(){
 return alert('La creación del dueño se hace primero desde Firebase Authentication. Después se vincula con el usuario de la colección usr.');
}

async function salir(){
 try{
   if(window.FB?.auth) await window.FB.signOut(window.FB.auth);
 }catch(e){console.error(e)}
 authUser=null; me=null; rol=null;
 try{sessionStorage.removeItem('u')}catch(e){}
 render();
}
