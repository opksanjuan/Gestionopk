<title>ORQUERA PARKOUR KINECT</title>

<style>
:root{--bg:#0d0f12;--card:#16191e;--tx:#f1f3f5;--mu:#8c95a3;--ac:#1d9bd6;--ac2:#00bcd4;--bd:#2a2f38;--ok:#2ecc71;--bad:#ff5a4d;--fh:Oswald,Impact,'Arial Narrow',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e4e7ea;--card:#fff;--tx:#14171b;--mu:#5d6673;--bd:#c9cfd6;--ok:#17883f;--bad:#c62f24}}
:root[data-theme="light"]{--bg:#e4e7ea;--card:#fff;--tx:#14171b;--mu:#5d6673;--bd:#c9cfd6;--ok:#17883f;--bad:#c62f24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;color:var(--tx);font:15px system-ui,sans-serif;background:var(--bg) radial-gradient(circle at 15% 0,rgba(29,155,214,.14),transparent 45%),radial-gradient(circle at 100% 100%,rgba(0,188,212,.1),transparent 40%) fixed}
main{max-width:980px;margin:0 auto;padding:12px}
.brand{display:flex;align-items:center;gap:14px;padding:6px 2px 12px;border-bottom:4px solid transparent;border-image:repeating-linear-gradient(135deg,var(--ac) 0 10px,transparent 10px 20px) 1;margin-bottom:12px}
.brand img{width:68px;height:68px;border-radius:50%;border:3px solid var(--ac);background:#fff;flex:none}
.brand h1{font:700 clamp(20px,5.5vw,32px)/1 var(--fh);letter-spacing:.07em;text-transform:uppercase;margin:0;text-shadow:2px 2px 0 var(--ac)}
.brand span{font:500 12px var(--fh);letter-spacing:.35em;text-transform:uppercase;color:var(--ac2)}
h1{font:700 20px var(--fh);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}nav button{white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}
button{cursor:pointer;font-family:var(--fh);letter-spacing:.05em;text-transform:uppercase;font-weight:500}
button.on,button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;transform:skewX(-6deg)}
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:6px;padding:12px;margin-bottom:12px}
.card b{font-family:var(--fh);letter-spacing:.05em;text-transform:uppercase}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
.w{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--ac2);font-family:var(--fh);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.mu{color:var(--mu)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k div{background:var(--bg);border-radius:6px;padding:10px;border-bottom:3px solid var(--ac)}.k b{display:block;font:700 22px var(--fh)}
textarea{width:100%;min-height:80px}.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$=n=>'$'+Number(n||0).toLocaleString('es-AR'),fd=s=>s?s.split('-').reverse().join('/'):'';
const hoy=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

const A='adm/root/',P={alumnos:'alumnos',pend:'pend',asistA:'asistA',usr:'usr',pagos:A+'pagos',egresos:A+'egresos',profes:A+'profes',horas:'horasP',prof:'prof',extras:A+'extras'};
const C={};Object.keys(P).forEach(k=>C[k]={});
const got={};let rol=null,db=null,U=null,ED=false,me=null,loaded=false,dirty=false,tab='',mes=hoy.slice(0,7),fecha=hoy,q='',edit=null;

const uid=()=>String(Date.now())+Math.floor(Math.random()*99);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const card=h=>`<div class="card">${h}</div>`,opts=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${esc(x)}</option>`).join('');
const al=c=>C.alumnos[c],nom=c=>al(c)?al(c).nombre:'(eliminado)',pn=id=>(C.profes[id]||{nombre:'(eliminado)'}).nombre;
const sorted=()=>L('alumnos').sort((a,b)=>a.nombre.localeCompare(b.nombre));
const nextCod=()=>Math.max(0,...L('alumnos').map(a=>a.cod))+1;
const edad=n=>{if(!n)return'';const d=new Date(n),t=new Date();let e=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))e--;return e};
const dueno=()=>me&&me.rol=='dueño',isIn=()=>/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
const mesI=()=>card(`<label>Mes</label><input type="month" value="${mes}" onchange="mes=this.value;render()">`);

(async()=>{try{db=await claude.use('db');U=await claude.use('user')}catch(e){}
 ED=!!(U&&U.canEdit&&U.canEdit());if(!db)return render();
 ['alumnos','pend','asistA','usr','prof','horas'].concat(ED?['pagos','egresos','profes','extras']:[]).forEach(k=>db.collection(P[k]).onSnapshot(s=>{
  C[k]=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));got[k]=1;sync();
  if(k=='usr'){loaded=true;if(!me){try{const u=sessionStorage.getItem('u');if(u&&C.usr[u])me={u,...C.usr[u]}}catch(e){}}}
  rr()},e=>{if(k=='usr'){loaded=true;rr()}}))})();
const roster=()=>(dueno()?L('profes'):L('prof')).sort((a,b)=>a.nombre.localeCompare(b.nombre));
function sync(){if(!ED||!got.profes||!got.prof)return;
 L('profes').forEach(p=>{if(!C.prof[p.id]||C.prof[p.id].nombre!==p.nombre)put('prof',p.id,{id:p.id,nombre:p.nombre})});
 Object.keys(C.prof).forEach(id=>{if(!C.profes[id])rm('prof',id)})}

const tabsFor=()=>dueno()?{resumen:'Resumen',alumnos:'Alumnos',cobros:'Pagos',caja:'Caja',asist:'Asist. alumnos',profes:'Profesores',users:'Usuarios'}:{alumnos:'Alumnos',cobros:'Pagos',profes:'Asistencia profesores'};
function render(){const a=$('#app');

 a.innerHTML=`<div class="top"><b>${esc(me.nombre)} <span class="mu">· ${me.rol}</span></b><button onclick="salir()">Salir</button></div><nav>${Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';q='';edit=null;render()">${T[k]}</button>`).join('')}</nav>`+V[tab]()}
function loginV(){const n=!L('usr').length,vol='<button onclick="rol=null;render()">← Volver</button>',box=h=>`<div class="card" style="max-width:380px;margin:40px auto">${h}</div>`;
 if(!rol)return box(`<div class="mu" style="text-align:center;margin-bottom:6px">¿Cómo querés ingresar?</div><div class="r" style="justify-content:center"><button class="p" onclick="rol='dueño';render()">👑 Soy Dueño</button><button class="p" onclick="rol='coordinador';render()">📋 Soy Coordinador</button></div>`);
 if(n&&rol!='dueño')return box(`<div class="mu">El sistema todavía no fue configurado. El dueño debe ingresar primero para crear su cuenta.</div><div class="r">${vol}</div>`);
 if(n&&!ED)return box(`<div class="mu">Para la configuración inicial abrí el sistema con la cuenta de Claude del dueño.</div><div class="r">${vol}</div>`);
 return box(`<h1>${n?'Configuración inicial: cuenta del dueño':'Ingreso de '+rol}</h1>${n?'<label>Nombre</label><input id="ln" style="width:100%">':''}<label>Usuario</label><input id="lu" autocapitalize="none" style="width:100%"><label>Contraseña</label><input id="lp" type="password" style="width:100%"><div class="r"><button class="p" onclick="${n?'setup()':'login()'}">${n?'Crear y entrar':'Entrar'}</button>${vol}</div>`)}
const ent=(u,r)=>{me={u,...r};try{sessionStorage.setItem('u',u)}catch(e){}tab='';render()};
async function login(){const u=$('#lu').value.trim().toLowerCase(),r=C.usr[u];
 if(!r||r.hash!==await sha(r.salt+$('#lp').value))return alert('Usuario o contraseña incorrectos');
 if(r.rol!=rol)return alert('Esa cuenta no es de '+rol+'. Volvé y elegí la opción correcta.');
 if(r.rol=='dueño'&&!ED)return alert('La cuenta de dueño solo funciona abriendo con la cuenta que tiene permiso de editor.');ent(u,r)}
async function setup(){const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,n=$('#ln').value.trim();
